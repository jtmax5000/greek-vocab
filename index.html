/* Layout: one centered study column. Deck bar on top, one large flip card, two answer buttons below. */
:root {
  --bg: #eef1f4;
  --surface: #ffffff;
  --fg: #1b2430;
  --muted: #5d6a79;
  --line: #d3dae2;
  --accent: #2f5d8a;
  --accent-ink: #ffffff;
  --know: #2b7a55;
  --know-bg: #e0f0e8;
  --learn: #a85d1a;
  --learn-bg: #f7e8d6;
  --font-greek: "Gentium Plus", "Palatino Linotype", "Times New Roman", serif;
  --font-ui: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11161d; --surface: #1a222c; --fg: #e6ebf1; --muted: #93a0b0; --line: #2c3745;
    --accent: #7fb0e0; --accent-ink: #0d1a28;
    --know: #6cc79c; --know-bg: #17352a; --learn: #e5a566; --learn-bg: #3a2814;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11161d; --surface: #1a222c; --fg: #e6ebf1; --muted: #93a0b0; --line: #2c3745;
  --accent: #7fb0e0; --accent-ink: #0d1a28;
  --know: #6cc79c; --know-bg: #17352a; --learn: #e5a566; --learn-bg: #3a2814;
  color-scheme: dark;
}
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-ui);
  padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  font-size: 15px; line-height: 1.45;
}
.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
h1 { font-family: var(--font-greek); font-size: 1.6rem; margin: 0; font-weight: 700; text-wrap: balance; }
.sub { color: var(--muted); margin: 0; font-size: 0.9rem; }
.view { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; background: var(--line); border-radius: 12px; }
.tab { font: 600 0.9rem var(--font-ui); padding: 9px 10px; border: 0; border-radius: 9px; background: none; color: var(--muted); cursor: pointer; }
.tab[aria-selected="true"] { background: var(--surface); color: var(--fg); }
.lbl { font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin-right: 2px; }
.chip.num { min-width: 42px; padding: 7px 10px; text-align: center; font-variant-numeric: tabular-nums; }
.search { font: 500 1rem var(--font-ui); width: 100%; box-sizing: border-box; padding: 11px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); }
.search:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.glossary { display: flex; flex-direction: column; gap: 20px; }
.lesson { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px 6px; scroll-margin-top: 12px; }
.lesson h2 { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin: 0 0 4px; font: 700 1rem var(--font-ui); }
.lesson h2 span { font-weight: 500; font-size: 0.8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.lesson dl { margin: 0; }
.w { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); }
.w dt { font-family: var(--font-greek); font-size: 1.25rem; line-height: 1.25; overflow-wrap: anywhere; }
.w dd { margin: 0; overflow-wrap: anywhere; }
.w small { display: block; color: var(--muted); font-size: 0.8rem; margin-top: 2px; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip {
  font: 600 0.85rem var(--font-ui); padding: 7px 14px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface); color: var(--muted);
}
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.chip.ghost { margin-left: auto; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.progress { display: flex; flex-direction: column; gap: 6px; }
.track { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
.fill { height: 100%; width: 0; background: var(--know); transition: width .3s ease; }
.stats { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: 0.85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.stats b { color: var(--fg); }
.scene { perspective: 1200px; }
.card {
  display: grid; width: 100%; min-height: 300px; padding: 0; border: 0; background: none; cursor: pointer;
  transform-style: preserve-3d; transition: transform .45s ease; font: inherit; color: inherit; text-align: center;
}

  {l:16,g:"ἐκβάλλω",e:"I cast out"},
  {l:16,g:"ἐλήμφθην",e:"I was taken",n:"Aorist passive of λαμβάνω"},
  {l:16,g:"εὑρέθην",e:"I was found",n:"Aorist passive of εὑρίσκω"},
  {l:16,g:"ἠγέρθην",e:"I was raised",n:"Aorist passive of ἐγείρω"},
  {l:16,g:"ἠνέχθην",e:"I was brought",n:"Serves as the aorist passive of φέρω"},
  {l:16,g:"ἤχθην",e:"I was led",n:"Aorist passive of ἄγω"},
  {l:16,g:"πῶς",e:"how?"},
  {l:16,g:"ὤφθην",e:"I was seen, I appeared",n:"Serves as the aorist passive of ὁράω"}
];
const LESSONS = Array.from(new Set(CARDS.map(c => c.l))).sort((a, b) => a - b);

const S = { view: "drill", lessons: new Set([10,11,12]), total: 0, queue: [], next: [], known: new Set(), miss: {}, round: 1, roundSize: 0, history: [], finished: false };
const $ = id => document.getElementById(id);
const PERSIST = true;
const KEY = "greek-vocab-drill-v1";

function save() {
  if (!PERSIST) return;
  try {
    localStorage.setItem(KEY, JSON.stringify({ n: CARDS.length, lessons: Array.from(S.lessons), total: S.total, queue: S.queue, next: S.next,
      known: Array.from(S.known), miss: S.miss, round: S.round, roundSize: S.roundSize, finished: S.finished }));
  } catch (e) {}
}

function load() {
  if (!PERSIST) return false;
  try {
    const d = JSON.parse(localStorage.getItem(KEY) || "null");
    if (!d || d.n !== CARDS.length || !Array.isArray(d.queue) || !d.lessons.length) return false;
    S.lessons = new Set(d.lessons); S.total = d.total; S.queue = d.queue; S.next = d.next; S.known = new Set(d.known);
    S.miss = d.miss || {}; S.round = d.round; S.roundSize = d.roundSize; S.finished = !!d.finished; S.history = [];
    return true;
  } catch (e) { return false; }
}

function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

function start() {
  const ids = CARDS.map((c, i) => i).filter(i => S.lessons.has(CARDS[i].l));
  S.total = ids.length; S.queue = shuffle(ids); S.next = []; S.known = new Set(); S.miss = {};
  S.round = 1; S.roundSize = ids.length; S.history = []; S.finished = false;
  render();
}

function snapshot() {
  S.history.push({ queue: S.queue.slice(), next: S.next.slice(), known: Array.from(S.known), miss: Object.assign({}, S.miss), round: S.round, roundSize: S.roundSize });
}

function mark(knew) {
  if (S.finished || !S.queue.length) return;
  snapshot();
  const id = S.queue.shift();
  if (knew) S.known.add(id); else { S.next.push(id); S.miss[id] = (S.miss[id] || 0) + 1; }
  if (!S.queue.length) {
    if (S.next.length) { S.round++; S.queue = shuffle(S.next); S.next = []; S.roundSize = S.queue.length; }
    else S.finished = true;
  }
  render();
}

function undo() {
  const h = S.history.pop();
  if (!h) return;
  S.queue = h.queue; S.next = h.next; S.known = new Set(h.known); S.miss = h.miss; S.round = h.round; S.roundSize = h.roundSize; S.finished = false;
  render();
}

function flip() {
  const c = document.getElementById("card");
  if (c) { const f = c.classList.toggle("flipped"); c.setAttribute("aria-pressed", f ? "true" : "false"); }
}

function renderChips() {
  $("chips").innerHTML = `<span class="lbl">Lessons</span>` +
    LESSONS.map(n => `<button class="chip num" data-l="${n}" aria-label="Lesson ${n}" aria-pressed="${S.lessons.has(n)}">${n}</button>`).join("") +
    `<button class="chip ghost" id="restart">Restart</button>`;
}

function render() {
  save();
  renderChips();
  const done = S.known.size;
  $("fill").style.width = (S.total ? (done / S.total) * 100 : 0) + "%";
  const pos = S.roundSize - S.queue.length + 1;
  $("stats").innerHTML = S.finished
    ? `<span><b>${done}</b> of ${S.total} known</span><span>Finished in ${S.round} round${S.round > 1 ? "s" : ""}</span>`
    : `<span><b>${done}</b> of ${S.total} known</span><span>Round ${S.round} · card ${pos} of ${S.roundSize}</span>`;

  if (S.finished) {
    const hard = Object.keys(S.miss).map(Number).sort((a, b) => S.miss[b] - S.miss[a]).slice(0, 6);
    $("main").innerHTML = `<div class="done">
      <h2>Καλῶς! All ${S.total} known.</h2>
      <p class="sub" style="margin:0">${hard.length ? "The cards that took the most tries:" : "You knew every card on the first pass."}</p>
      ${hard.length ? `<ul class="hard">${hard.map(i => `<li><span class="g">${CARDS[i].g}</span><span>${CARDS[i].e}</span><span class="m">missed ${S.miss[i]}×</span></li>`).join("")}</ul>` : ""}
      <div class="row"><button class="btn-main" id="again">Study again</button></div>
    </div>`;
    return;
  }

  const c = CARDS[S.queue[0]];
  $("main").innerHTML = `
    <div class="scene">
      <button class="card" id="card" aria-pressed="false" aria-label="Flashcard. Press to flip.">
        <span class="face front"><span class="tag">Lesson ${c.l}</span><span class="greek">${c.g}</span><span class="hint">Tap to flip</span></span>
        <span class="face back"><span class="tag">Lesson ${c.l}</span><span class="eng">${c.e}</span>${c.n ? `<span class="note">${c.n}</span>` : ""}</span>
      </button>
    </div>
    <div class="actions" style="margin-top:16px">
      <button class="btn learn" id="no">Still learning<small>sends it to the next round</small></button>
      <button class="btn know" id="yes">I know it<small>removes it from the deck</small></button>
    </div>
    <button class="undo" id="undo" ${S.history.length ? "" : "disabled"}>Undo last answer</button>`;
}

function norm(t) { return t.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/ς/g, "σ"); }

function renderList() {
  const q = norm($("q").value.trim());
  let html = "", shown = 0;
  for (const l of LESSONS) {
    const rows = CARDS.filter(c => c.l === l && (!q || norm(c.g + " " + c.e + " " + (c.n || "")).includes(q)));
    if (!rows.length) continue;
    shown += rows.length;
    html += `<section class="lesson" id="lesson-${l}"><h2>Lesson ${l}<span>${rows.length} word${rows.length > 1 ? "s" : ""}</span></h2><dl>` +
      rows.map(c => `<div class="w"><dt lang="grc">${c.g}</dt><dd>${c.e}${c.n ? `<small>${c.n}</small>` : ""}</dd></div>`).join("") + `</dl></section>`;
  }
  $("glossary").innerHTML = html;
  $("count").textContent = q ? (shown ? `${shown} of ${CARDS.length} words match.` : "No words match that search.")
    : `All ${CARDS.length} words from Lessons ${LESSONS[0]}-${LESSONS[LESSONS.length - 1]}, by lesson.`;
  $("jump").hidden = !!q;
}

function setView(v) {
  S.view = v;
  $("view-drill").hidden = v !== "drill";
  $("view-list").hidden = v !== "list";
  $("tab-drill").setAttribute("aria-selected", v === "drill");
  $("tab-list").setAttribute("aria-selected", v === "list");
  if (v === "list") renderList();
}

$("jump").innerHTML = `<span class="lbl">Jump to</span>` + LESSONS.map(n => `<button class="chip num" data-j="${n}" aria-label="Jump to Lesson ${n}">${n}</button>`).join("");
$("q").addEventListener("input", renderList);

document.addEventListener("click", e => {
  const t = e.target.closest("button");
  if (!t) return;
  if (t.id === "tab-drill") setView("drill");
  else if (t.id === "tab-list") setView("list");
  else if (t.dataset.j) { const el = $("lesson-" + t.dataset.j); if (el) el.scrollIntoView({ block: "start" }); }
  else if (t.id === "card") flip();
  else if (t.id === "yes") mark(true);
  else if (t.id === "no") mark(false);
  else if (t.id === "undo") undo();
  else if (t.id === "restart" || t.id === "again") start();
  else if (t.dataset.l) {
    const n = Number(t.dataset.l);
    if (S.lessons.has(n)) { if (S.lessons.size > 1) S.lessons.delete(n); } else S.lessons.add(n);
    start();
  }
});

document.addEventListener("keydown", e => {
  if (S.view !== "drill" || e.target.tagName === "INPUT") return;
  if (e.target.closest && e.target.closest(".chip, .undo, .btn-main")) { if (e.key === " " || e.key === "Enter") return; }
  if (e.key === "ArrowRight") { e.preventDefault(); mark(true); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); mark(false); }
  else if (e.key === " " && !S.finished) { e.preventDefault(); flip(); }
});

if (load()) render(); else start();

if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
</body>
</html>
